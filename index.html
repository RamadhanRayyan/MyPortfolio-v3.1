<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayy — Fullstack Vibe Developer</title>
    <meta
      name="description"
      content="Personal developer portfolio of Muhammad Ramadhan Rayyan (Rayy), a Fullstack Vibe Developer based in Semarang, Indonesia turning ideas into real digital products."
    />
    <meta property="og:title" content="Rayy — Fullstack Vibe Developer" />
    <meta
      property="og:description"
      content="I turn ideas into real digital products. Selected websites, business systems, and digital platforms by Muhammad Ramadhan Rayyan."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rayy-theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#171717] dark:bg-[#111111] dark:text-[#F5F5F5] antialiased selection:bg-[#0F766E]/20 selection:text-[#0F766E] dark:selection:bg-[#2DD4BF]/25 dark:selection:text-[#2DD4BF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
